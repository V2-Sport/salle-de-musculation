    <link rel="stylesheet" href="script.js">

        integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
        </script>

</head>

<body>

    <header class="">

        <button class="space-between border backgroundcolor5 margin-top-10" type="button" commandfor="mydialog"
            command="show-modal">

            <img class="backgroundcolor4 marginleft3" src="asset/trois trait.png" alt="">

        </button>

        <dialog class="backgroundcolor4 border margin-top-60 static" id="mydialog">

            <div class="">

                <form class="">

                    <fieldset>

                        <legend class="text-align-center">

                            <br><a class="marginright" href="index.html">Accueil</a>

                            <br><br><a class="marginright" href="Infrastructure.html">Infrastructure</a>

                            <br><br><a class="marginright" href="Les Prestations.html">Les Prestation</a>

                            <br><br><a class="marginright" href="QR Code.html">QR Code</a>

                            <br><br><button type="button" commandfor="mydialog" command="close"
                                class="backgroundcolor4">Fermer</button>

                        </legend>

                    </fieldset>

                </form>

            </div>

        </dialog>

    </header>

    <section class="flex margin-top-30 margin-bottom gap marginleft">

        <button id="btn">Appuyer pour Générer un QR code</button>

        <a href="index.html">Appuyer sur ce texte si vous avez du mal avec le QR Code.</a>

    </section>

    <div class="marginleft" id="qrcode-container"></div>

    <script>
        document.getElementById('btn').addEventListener('click', createQRCode);
        function createQRCode() {
            const QRContainer = document.getElementById("qrcode-container");
            QRContainer.innerHTML = "";
            new QRCode(QRContainer, 'https://v2-sport.github.io/salle-de-musculation/');
        }
    </script>

</body>
